# ============================================================================
# CD: on a version tag (v1.2.3) — rebuild + push images to GHCR with
# immutable version tags, then cut a GitHub Release with autogenerated notes.
#
# Deployment model (see docs/architecture.md):
#   images are the deployable artifact; environments (compose locally,
#   ECS/EKS or EMR in prod) pull a *pinned* tag — never :latest.
# ============================================================================
name: cd

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release-images:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [app, spark, airflow]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: release-images
    steps:
      - uses: actions/checkout@v4
      - name: Create release with autogenerated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
